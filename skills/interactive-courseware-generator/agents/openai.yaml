interface:
  display_name: "交互式课件生成器"
  short_description: "生成单页或紧凑多页、低干扰且可验证的交互式 HTML 课件"
  default_prompt: "使用 $interactive-courseware-generator，把我给出的知识点、紧凑主题或已有教案生成低干扰的交互式 HTML 课件；先判断单页还是同目录课件组，用具体案例贯穿，说明解决什么问题，并为技术主题提供与交互同步的最小真实用法；按已有经验、机制示范、对比和独立预测组织理解路径；需要精确 3D 时使用 Blender bpy 建模并验证几何与导出；交付验证报告，只有需要讲解编排时才生成教学动作。"
