interface:
  display_name: "交互式课件生成器"
  short_description: "把单个知识点生成一页可操作、可观察、可验证的 HTML 课件"
  default_prompt: "使用 $interactive-courseware-generator，把我给出的主题和教学目标生成一页交互式 HTML 课件，并交付教学动作与验证报告。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
