<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>变量关系模拟</title>
</head>
<body>
  <main>
    <label for="main_variable-slider">主变量</label>
    <input id="main_variable-slider" data-var="main_variable" type="range" min="0" max="100" value="50" aria-label="主变量">
    <span id="main_variable-display">50%</span>
    <button id="start-btn" type="button">启动</button>
    <button id="reset-btn" type="button">重置</button>
    <canvas id="canvas" width="640" height="360"></canvas>
  </main>
  <script type="application/json" id="courseware-config">
    {
      "schemaVersion": 1,
      "kind": "simulation",
      "topic": "variable_relationship",
      "description": "验证最小运行合同",
      "hostBridge": true,
      "variables": [
        {
          "name": "main_variable",
          "label": "主变量",
          "min": 0,
          "max": 100,
          "step": 1,
          "default": 50,
          "unit": "%"
        }
      ],
      "presets": [
        {
          "name": "低值",
          "variables": { "main_variable": 20 }
        }
      ]
    }
  </script>
  <script>
    let animationId = 0;
    function frame() {
      animationId = requestAnimationFrame(frame);
    }
    function updateState(state) {
      const input = document.getElementById('main_variable-slider');
      if (typeof state.main_variable === 'number') {
        input.value = String(Math.max(0, Math.min(100, state.main_variable)));
      }
    }
    window.addEventListener('keydown', (event) => {
      if (event.key === ' ') frame();
      if (event.key.toLowerCase() === 'r') updateState({ main_variable: 50 });
    });
    window.addEventListener('message', (event) => {
      if (!event.data || typeof event.data !== 'object') return;
      const { type, state, target, content } = event.data;
      if (type === 'COURSEWARE_SET_STATE') updateState(state || {});
      if (type === 'COURSEWARE_HIGHLIGHT' && target) document.querySelector(target)?.classList.add('highlight');
      if (type === 'COURSEWARE_ANNOTATE' && target && content) document.querySelector(target)?.setAttribute('data-note', String(content));
      if (type === 'COURSEWARE_REVEAL' && target) document.querySelector(target)?.removeAttribute('hidden');
    });
  </script>
</body>
</html>
