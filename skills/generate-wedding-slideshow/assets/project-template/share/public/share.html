<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>婚礼分享</title>
<link rel="icon" href="data:,">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-0:#040612;--bg-1:#0f1731;--bg-2:#2b1645;
  --gold:rgba(245,204,113,.92);--warm:rgba(249,241,224,.94);
  --warm-soft:rgba(249,241,224,.62);--line:rgba(255,255,255,.09);
}
html,body{width:100%;height:100%;overflow:hidden;background:
radial-gradient(circle at 18% 16%, rgba(98,149,255,.24), transparent 28%),
radial-gradient(circle at 82% 16%, rgba(255,126,174,.2), transparent 28%),
radial-gradient(circle at 50% 82%, rgba(245,204,113,.16), transparent 26%),
linear-gradient(145deg,var(--bg-0) 0%,var(--bg-1) 42%,var(--bg-2) 100%);
color:var(--warm);font-family:"Noto Serif SC","Songti SC",serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 22% 24%, rgba(255,255,255,.08) 0 1px, transparent 2px),
radial-gradient(circle at 76% 20%, rgba(245,204,113,.22) 0 1px, transparent 2px),
radial-gradient(circle at 68% 78%, rgba(102,151,255,.18) 0 1px, transparent 2px),
radial-gradient(circle at 28% 72%, rgba(255,135,180,.18) 0 1px, transparent 2px);opacity:.72}
.gate,.app{position:fixed;inset:0}
.gate{z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:
radial-gradient(circle at center, rgba(44,24,74,.5), rgba(5,7,16,.92) 58%, rgba(0,0,0,.98) 100%);
transition:opacity .45s ease,visibility .45s ease}
.gate.hidden{opacity:0;visibility:hidden;pointer-events:none}
.gate-card{width:min(92vw,420px);padding:32px 24px 24px;border-radius:28px;background:rgba(9,11,22,.6);border:1px solid rgba(245,204,113,.16);box-shadow:0 24px 80px rgba(0,0,0,.34);backdrop-filter:blur(18px);text-align:center}
.gate-title{font-size:clamp(28px,7vw,36px);font-weight:300;letter-spacing:.18em}
.gate-sub{margin-top:14px;line-height:1.8;font-size:14px;color:var(--warm-soft)}
.password{width:100%;height:58px;margin-top:22px;border:1px solid rgba(245,204,113,.24);border-radius:18px;background:rgba(255,255,255,.06);color:var(--warm);font-size:24px;text-align:center;letter-spacing:.28em;outline:none}
.enter{width:100%;height:54px;margin-top:14px;border:0;border-radius:16px;background:linear-gradient(135deg, rgba(245,204,113,.9), rgba(233,167,72,.94));color:#1d1306;font-size:15px;letter-spacing:.22em}
.error{min-height:20px;margin-top:10px;font-size:12px;color:rgba(255,170,170,.9)}
#skyField,#light-beams,#star-trails{position:fixed;inset:0;pointer-events:none}
#skyField{z-index:1}
#light-beams{z-index:1;overflow:hidden;mix-blend-mode:screen}
#star-trails{z-index:2;overflow:hidden}
.beam{position:absolute;width:24vw;height:160vh;top:-28vh;border-radius:999px;opacity:.3;filter:blur(26px);transform-origin:center top;animation:beam-sway 14s ease-in-out infinite alternate}
.beam.b1{left:2vw;background:linear-gradient(to bottom, rgba(111,159,255,.3), rgba(111,159,255,.06) 34%, transparent 78%);transform:rotate(-18deg)}
.beam.b2{left:38vw;background:linear-gradient(to bottom, rgba(255,137,180,.26), rgba(255,137,180,.06) 34%, transparent 78%);transform:rotate(4deg);animation-delay:-7s}
.beam.b3{right:4vw;background:linear-gradient(to bottom, rgba(245,204,113,.28), rgba(245,204,113,.06) 34%, transparent 78%);transform:rotate(16deg);animation-delay:-10s}
@keyframes beam-sway{from{opacity:.12;transform:translateY(-1vh) rotate(var(--r,0deg)) scaleY(.98)}to{opacity:.34;transform:translateY(1.8vh) rotate(calc(var(--r,0deg) + 5deg)) scaleY(1.08)}}
.trail{position:absolute;width:clamp(180px,18vw,320px);height:2px;border-radius:999px;opacity:0;background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,247,228,.94) 18%, rgba(255,221,164,.74) 45%, rgba(149,187,255,.18) 82%, rgba(149,187,255,0));box-shadow:0 0 12px rgba(255,232,191,.42);transform-origin:left center;animation:trail-drift var(--d,16s) linear infinite, trail-bloom var(--d,16s) ease-in-out infinite}
.trail.t1{top:16%;left:-12%;--r:10deg;--d:18s;animation-delay:-3s}.trail.t2{top:28%;left:68%;--r:-12deg;--d:20s;animation-delay:-11s}.trail.t3{top:54%;left:-10%;--r:8deg;--d:22s;animation-delay:-7s}.trail.t4{top:66%;left:74%;--r:-14deg;--d:19s;animation-delay:-15s}.trail.t5{top:38%;left:18%;--r:-7deg;--d:24s;animation-delay:-5s}
@keyframes trail-drift{0%{transform:translate3d(-8vw,2vh,0) rotate(var(--r,0deg))}100%{transform:translate3d(12vw,-3vh,0) rotate(var(--r,0deg))}}
@keyframes trail-bloom{0%,14%,100%{opacity:0}22%,64%{opacity:.88}78%{opacity:.2}}
.app{z-index:3}
.bg-blur{position:absolute;inset:-8%;z-index:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.34) saturate(1.05);transform:scale(1.12);opacity:.44;transition:background-image .4s ease}
.bg-vignette{position:absolute;inset:0;z-index:2;background:
linear-gradient(180deg, rgba(2,4,12,.36), rgba(2,4,12,.04) 28%, rgba(2,4,12,.58) 100%),
radial-gradient(circle at center, transparent 24%, rgba(0,0,0,.34) 100%)}
.top{position:absolute;top:14px;left:14px;right:14px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top-right{display:inline-flex;align-items:center;gap:10px}
.chip,.music-toggle{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(8,10,20,.26);border:1px solid var(--line);backdrop-filter:blur(12px);font-size:11px;letter-spacing:.14em}
.chip{color:rgba(249,241,224,.76)}
.chip.music{color:var(--gold)}
.music-toggle{min-height:40px;color:rgba(249,241,224,.9);appearance:none;-webkit-appearance:none}
.music-toggle.is-on{color:rgba(245,204,113,.98);border-color:rgba(245,204,113,.34)}
.music-toggle.is-off{color:rgba(249,241,224,.72)}
.music-toggle svg{width:14px;height:14px;flex:0 0 auto}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 14px 78px}
.photo-shell{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.photo-frame{position:relative;width:min(100%,980px);height:min(78vh,100%);overflow:visible}
.hero-orbits{position:absolute;inset:50% auto auto 50%;width:min(74vw,760px);height:min(74vw,760px);transform:translate(-50%,-50%);pointer-events:none}
.orbit{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 24px rgba(255,255,255,.03),0 0 32px rgba(245,204,113,.03);animation:orbit-spin 18s linear infinite}
.orbit.o2{inset:9%;border-color:rgba(245,204,113,.16);animation-duration:13s;animation-direction:reverse}
.orbit.o3{inset:22%;border-color:rgba(255,130,177,.14);animation-duration:10s}
@keyframes orbit-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 30px 70px rgba(0,0,0,.38))}
.photo.entering{animation:photo-in .7s cubic-bezier(.16,1,.3,1)}
@keyframes photo-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.nav{position:absolute;top:0;bottom:0;z-index:6;width:38%;padding:0;border:0;background:transparent;appearance:none;-webkit-appearance:none}
.nav.prev{left:0}.nav.next{right:0;width:62%}
.nav-indicator{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:999px;background:rgba(8,10,20,.22);border:1px solid rgba(255,255,255,.08);color:rgba(249,241,224,.62);display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(10px)}
.nav.prev .nav-indicator{left:14px}.nav.next .nav-indicator{right:14px}
.bottom{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;width:min(92vw,620px);display:grid;gap:10px;justify-items:center}
.hint,.bar{padding:10px 14px;border-radius:999px;background:rgba(8,10,20,.22);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px)}
.hint{font-size:11px;color:rgba(249,241,224,.72);letter-spacing:.1em}
.bar{width:100%;padding:8px}.bar-fill{height:4px;border-radius:999px;background:linear-gradient(90deg, rgba(98,149,255,.95), rgba(255,130,177,.92), rgba(245,204,113,.95));width:0%}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;font-size:14px;letter-spacing:.18em;color:rgba(249,241,224,.62)}
</style>
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-title">婚礼相册</div>
      <div class="gate-sub">输入密码后即可查看。<br>同一台设备通常只需输入一次。</div>
      <form id="gateForm">
        <input class="password" id="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="请输入密码" autocomplete="one-time-code">
        <button class="enter" type="submit">进入相册</button>
        <div class="error" id="error"></div>
      </form>
    </div>
  </div>
  <div id="light-beams"><span class="beam b1" style="--r:-18deg"></span><span class="beam b2" style="--r:8deg"></span><span class="beam b3" style="--r:16deg"></span></div>
  <div id="star-trails"><span class="trail t1"></span><span class="trail t2"></span><span class="trail t3"></span><span class="trail t4"></span><span class="trail t5"></span></div>
  <main class="app">
    <canvas id="skyField"></canvas>
    <div class="bg-blur" id="bgBlur"></div>
    <div class="bg-vignette"></div>
    <audio id="bgm" preload="none"></audio>
    <div class="top">
      <div class="chip" id="countChip">准备中</div>
      <div class="top-right">
        <div class="chip music" id="kindChip">婚礼分享</div>
        <button class="music-toggle is-off" id="musicToggle" type="button" aria-label="开启背景音乐" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17V6l8-2v11"></path><circle cx="6" cy="18" r="2.6"></circle><circle cx="18" cy="16" r="2.6"></circle></svg>
          <span id="musicToggleText">音乐关</span>
        </button>
      </div>
    </div>
    <div class="stage">
      <div class="photo-shell" id="photoShell">
        <div class="hero-orbits"><div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div></div>
        <div class="photo-frame" id="photoFrame"><canvas class="photo" id="photoCanvas" aria-label="婚礼照片"></canvas></div>
        <button class="nav prev" id="prevBtn" aria-label="上一张"><span class="nav-indicator">‹</span></button>
        <button class="nav next" id="nextBtn" aria-label="下一张"><span class="nav-indicator">›</span></button>
      </div>
    </div>
    <div class="bottom"><div class="hint">左侧上一张 · 右侧下一张</div><div class="bar"><div class="bar-fill" id="barFill"></div></div></div>
    <div class="loading" id="loading">照片准备中</div>
  </main>
<script>
const gate=document.getElementById('gate');const gateForm=document.getElementById('gateForm');const passwordInput=document.getElementById('password');const errorBox=document.getElementById('error');const loading=document.getElementById('loading');const photoShell=document.getElementById('photoShell');const photoCanvas=document.getElementById('photoCanvas');const photoFrame=document.getElementById('photoFrame');const bgBlur=document.getElementById('bgBlur');const countChip=document.getElementById('countChip');const kindChip=document.getElementById('kindChip');const musicToggle=document.getElementById('musicToggle');const musicToggleText=document.getElementById('musicToggleText');const barFill=document.getElementById('barFill');const prevBtn=document.getElementById('prevBtn');const nextBtn=document.getElementById('nextBtn');const bgm=document.getElementById('bgm');
const SLIDE_MS=4600;let photos=[];let playlist=[];let projectTitle='婚礼分享';let index=0;let trackIndex=0;let musicPrimed=false;let autoplayTimer=null;let autoplayStartedAt=0;let autoplayProgressRaf=0;let photoBitmap=null;let photoMotion=null;let photoRaf=0;const PHOTO_MOTIONS=['zi','zo','left','right'];
async function request(path,options){const res=await fetch(path,options);if(!res.ok)throw res;return res}
function updateMusicUI(){const isOn=musicPrimed&&!bgm.paused;musicToggle.classList.toggle('is-on',isOn);musicToggle.classList.toggle('is-off',!isOn);musicToggle.setAttribute('aria-pressed',isOn?'true':'false');musicToggle.setAttribute('aria-label',isOn?'关闭背景音乐':'开启背景音乐');musicToggleText.textContent=isOn?'音乐开':'音乐关';kindChip.textContent=isOn?`${projectTitle} · 播放中`:projectTitle}
function preloadAround(currentIndex){[-2,-1,1,2].forEach(offset=>{const item=photos[(currentIndex+offset+photos.length)%photos.length];if(!item)return;const img=new Image();img.src=item.src})}
async function drawPhoto(src){const response=await fetch(src,{credentials:'same-origin'});const bitmap=await createImageBitmap(await response.blob());if(photoBitmap)photoBitmap.close();photoBitmap=bitmap;photoMotion={name:PHOTO_MOTIONS[index%PHOTO_MOTIONS.length],startedAt:performance.now(),duration:SLIDE_MS+240};if(!photoRaf)photoRaf=requestAnimationFrame(drawPhotoFrame)}
function layoutPhotoFrame(bitmap){const shellRect=photoShell.getBoundingClientRect();const maxWidth=Math.min(shellRect.width,1180);const maxHeight=Math.min(shellRect.height,window.innerHeight*.82);const aspect=bitmap.width/bitmap.height;let width=maxWidth;let height=width/aspect;if(height>maxHeight){height=maxHeight;width=height*aspect}photoFrame.style.width=`${Math.max(220,Math.floor(width))}px`;photoFrame.style.height=`${Math.max(220,Math.floor(height))}px`}
function drawPhotoFrame(){photoRaf=0;if(!photoBitmap||!photoMotion)return;layoutPhotoFrame(photoBitmap);const dpr=Math.min(window.devicePixelRatio||1,2);const rect=photoFrame.getBoundingClientRect();photoCanvas.width=Math.max(1,Math.floor(rect.width*dpr));photoCanvas.height=Math.max(1,Math.floor(rect.height*dpr));photoCanvas.style.width=`${rect.width}px`;photoCanvas.style.height=`${rect.height}px`;const ctx=photoCanvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);const p=Math.min(1,(performance.now()-photoMotion.startedAt)/photoMotion.duration);const baseScale=Math.min(rect.width/photoBitmap.width,rect.height/photoBitmap.height);const safeZoom=.94+p*.06;let panX=0;let panY=0;if(photoMotion.name==='zi')panY=(.012-p*.024)*rect.height;else if(photoMotion.name==='zo')panY=(-.012+p*.024)*rect.height;else if(photoMotion.name==='left')panX=(-.018+p*.036)*rect.width;else if(photoMotion.name==='right')panX=(.018-p*.036)*rect.width;const drawWidth=photoBitmap.width*baseScale*safeZoom;const drawHeight=photoBitmap.height*baseScale*safeZoom;const dx=(rect.width-drawWidth)/2+panX;const dy=(rect.height-drawHeight)/2+panY;ctx.drawImage(photoBitmap,dx,dy,drawWidth,drawHeight);if(p<1)photoRaf=requestAnimationFrame(drawPhotoFrame)}
function startAutoplayProgress(){cancelAnimationFrame(autoplayProgressRaf);const tick=now=>{const progress=Math.min(1,(now-autoplayStartedAt)/SLIDE_MS);barFill.style.width=`${(progress*100).toFixed(2)}%`;if(progress<1)autoplayProgressRaf=requestAnimationFrame(tick)};autoplayProgressRaf=requestAnimationFrame(tick)}
function restartAutoplay(){clearTimeout(autoplayTimer);autoplayStartedAt=performance.now();startAutoplayProgress();autoplayTimer=setTimeout(()=>next(true),SLIDE_MS)}
function render(fromAuto=false){if(!photos.length)return;const item=photos[index];countChip.textContent=`${index+1} / ${photos.length}`;drawPhoto(item.src).catch(()=>{});bgBlur.style.backgroundImage=`url("${item.src}")`;preloadAround(index);restartAutoplay()}
function next(fromAuto=false){if(!photos.length)return;index=(index+1)%photos.length;render(fromAuto)}
function prev(){if(!photos.length)return;index=(index-1+photos.length)%photos.length;render(false)}
async function loadProject(){const data=await (await request('/api/project')).json();photos=data.photos||[];projectTitle=data.title||'婚礼分享';kindChip.textContent=projectTitle;countChip.textContent=photos.length?`1 / ${photos.length}`:'0 / 0'}
async function loadPlaylist(){const data=await (await request('/api/playlist')).json();playlist=(data.tracks||[]).map(item=>item.src)}
function tryStartMusic(){if(!playlist.length||musicPrimed)return;musicPrimed=true;bgm.volume=.72;bgm.src=playlist[trackIndex];bgm.play().catch(()=>{musicPrimed=false;updateMusicUI()});updateMusicUI()}
async function toggleMusic(){if(!musicPrimed){tryStartMusic();return}if(bgm.paused)await bgm.play().catch(()=>{});else bgm.pause();updateMusicUI()}
bgm.addEventListener('ended',()=>{if(!playlist.length)return;trackIndex=(trackIndex+1)%playlist.length;bgm.src=playlist[trackIndex];bgm.play().catch(()=>{})});bgm.addEventListener('play',updateMusicUI);bgm.addEventListener('pause',updateMusicUI);
async function checkSession(){const data=await (await request('/api/session')).json();if(data.authenticated){gate.classList.add('hidden');gate.style.display='none';await Promise.all([loadProject(),loadPlaylist()]);render();tryStartMusic();return true}loading.style.display='none';passwordInput.focus();return false}
gateForm.addEventListener('submit',async event=>{event.preventDefault();const password=passwordInput.value.replace(/\D/g,'');if(!password)return;errorBox.textContent='';try{await request('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});gate.classList.add('hidden');setTimeout(()=>{gate.style.display='none'},460);await Promise.all([loadProject(),loadPlaylist()]);render();tryStartMusic()}catch(error){errorBox.textContent='密码不正确，请再试一次';passwordInput.select()}});
passwordInput.addEventListener('input',()=>{passwordInput.value=passwordInput.value.replace(/\D/g,'').slice(0,10)});
prevBtn.addEventListener('click',prev);nextBtn.addEventListener('click',()=>next(false));prevBtn.addEventListener('click',tryStartMusic);nextBtn.addEventListener('click',tryStartMusic);musicToggle.addEventListener('click',()=>{toggleMusic().catch(()=>{})});
document.addEventListener('keydown',event=>{if(!gate.classList.contains('hidden'))return;if(event.key==='ArrowRight'||event.key===' '||event.key==='Enter'){event.preventDefault();tryStartMusic();next(false)}else if(event.key==='ArrowLeft'){event.preventDefault();tryStartMusic();prev()}else if(event.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
checkSession().catch(()=>{loading.style.display='none';errorBox.textContent='页面加载失败，请稍后刷新再试'});window.addEventListener('resize',()=>{if(photos.length){if(photoMotion)photoMotion.startedAt=performance.now();if(!photoRaf)photoRaf=requestAnimationFrame(drawPhotoFrame)}});
const canvas=document.getElementById('skyField');const ctx=canvas.getContext('2d');let stars=[];let comets=[];let dpr=1;let skyCenterX=0;let skyCenterY=0;let skyRadius=0;
function createStars(){stars=Array.from({length:260},()=>{const bloom=Math.random()<.18;const shimmer=Math.random()<.34;const tones=['gold','gold','pink','blue'];const radiusFactor=Math.pow(Math.random(),bloom?.76:.9);const orbitRadius=skyRadius*(.18+radiusFactor*.96);const orbitAngle=Math.random()*Math.PI*2;const orbitFlatten=.72+Math.random()*.2;const armDrift=(Math.random()-.5)*orbitRadius*.08;return{r:bloom?Math.random()*2.2+1.1:Math.random()*1.7+.28,glow:bloom?Math.random()*20+18:Math.random()*12+8,aura:bloom?Math.random()*.24+.22:Math.random()*.16+.1,orbitRadiusX:orbitRadius,orbitRadiusY:orbitRadius*orbitFlatten,orbitAngle,orbitSpeed:(.0000048+(1-radiusFactor)*.00001)*(bloom?.9:1),armDrift,twinkle:Math.random()*Math.PI*2,pulse:Math.random()*.0022+.0012,shimmer,tone:tones[Math.floor(Math.random()*tones.length)]}});comets=Array.from({length:5},()=>makeComet())}
function makeComet(){return{x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight*.5,vx:Math.random()*7+8,vy:Math.random()*2.2+1.1,life:Math.random()*220+120}}
function resetComet(comet){comet.x=Math.random()*window.innerWidth*.35;comet.y=Math.random()*window.innerHeight*.4;comet.vx=Math.random()*7+8;comet.vy=Math.random()*2.2+1.1;comet.life=Math.random()*220+120}
function starColor(tone,alpha){if(tone==='pink')return`rgba(255,132,179,${alpha})`;if(tone==='blue')return`rgba(119,171,255,${alpha})`;return`rgba(248,212,120,${alpha})`}
function starCore(tone,alpha){if(tone==='pink')return`rgba(255,227,239,${alpha})`;if(tone==='blue')return`rgba(227,238,255,${alpha})`;return`rgba(255,246,228,${alpha})`}
function starPosition(star,ts){const angle=star.orbitAngle+ts*star.orbitSpeed;const cos=Math.cos(angle);const sin=Math.sin(angle);const tangentX=-sin;const tangentY=cos;const drift=Math.sin(ts*.00045+star.twinkle)*star.armDrift;return{x:skyCenterX+cos*star.orbitRadiusX+tangentX*drift,y:skyCenterY+sin*star.orbitRadiusY+tangentY*drift*.42}}
function resizeSky(){dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(window.innerWidth*dpr);canvas.height=Math.floor(window.innerHeight*dpr);canvas.style.width=`${window.innerWidth}px`;canvas.style.height=`${window.innerHeight}px`;ctx.setTransform(dpr,0,0,dpr,0,0);skyCenterX=window.innerWidth*.5;skyCenterY=window.innerHeight*1.08;skyRadius=Math.hypot(window.innerWidth*.78,window.innerHeight*1.02);createStars()}
function drawSky(ts){ctx.clearRect(0,0,window.innerWidth,window.innerHeight);for(const star of stars){const pulse=(Math.sin(ts*star.pulse+star.twinkle)+1)*.5;const alpha=star.aura+pulse*(star.shimmer?.52:.34);const color=starColor(star.tone,alpha);const core=starCore(star.tone,Math.min(.96,alpha+.26));const pos=starPosition(star,ts);const x=pos.x;const y=pos.y;if(star.r>1.15){ctx.beginPath();ctx.fillStyle=starColor(star.tone,star.aura*.42+pulse*.12);ctx.shadowColor=color;ctx.shadowBlur=star.glow*1.6;ctx.arc(x,y,star.r*2.2,0,Math.PI*2);ctx.fill()}ctx.beginPath();ctx.fillStyle=core;ctx.shadowColor=color;ctx.shadowBlur=star.glow;ctx.arc(x,y,star.r,0,Math.PI*2);ctx.fill()}for(const comet of comets){comet.x+=comet.vx;comet.y+=comet.vy;comet.life-=1;if(comet.life<=0||comet.x>window.innerWidth+120||comet.y>window.innerHeight+60)resetComet(comet);const grad=ctx.createLinearGradient(comet.x,comet.y,comet.x-comet.vx*8,comet.y-comet.vy*8);grad.addColorStop(0,'rgba(255,255,255,.95)');grad.addColorStop(.22,'rgba(248,205,110,.75)');grad.addColorStop(1,'rgba(248,205,110,0)');ctx.strokeStyle=grad;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(comet.x,comet.y);ctx.lineTo(comet.x-comet.vx*8,comet.y-comet.vy*8);ctx.stroke()}ctx.shadowBlur=0;requestAnimationFrame(drawSky)}
resizeSky();requestAnimationFrame(drawSky);window.addEventListener('resize',resizeSky);updateMusicUI();
</script>
